<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- tints the mobile browser chrome -->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- iOS "Add to Home Screen" hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Randomize" />
    <title>Randomize - Free Online Randomizers, Pickers & Generators</title>
    <meta name="description" content="Free online randomizers and pickers: spin a wheel, draw random numbers, shuffle groups, flip a coin, plus random movies, games and songs. No sign-up, no ads." />
    <meta name="author" content="Simon Zaloudek" />

    <!-- Open Graph (link previews on social / chat apps) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Randomize" />
    <meta property="og:title" content="Randomize - Free Online Randomizers & Pickers" />
    <meta property="og:description" content="Spin a wheel, pick random numbers, shuffle groups, flip a coin, and discover random movies, games and songs. Free, no sign-up." />
    <meta property="og:url" content="https://userandomize.net/" />
    <meta property="og:image" content="https://userandomize.net/brand/RANDLOGO1.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Randomize - Free Online Randomizers & Pickers" />
    <meta name="twitter:description" content="Spin a wheel, pick random numbers, shuffle groups, and discover random movies, games and songs. Free, no sign-up." />
    <meta name="twitter:image" content="https://userandomize.net/brand/RANDLOGO1.png" />

    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- order matters: base first (theme vars), mobile last (touch overrides) -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/tools.css" />
    <link rel="stylesheet" href="css/movies.css" />
    <link rel="stylesheet" href="css/games.css" />
    <link rel="stylesheet" href="css/songs.css" />
    <link rel="stylesheet" href="css/rps.css" />
    <link rel="stylesheet" href="css/shiftplanner.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/about.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="icon" type="image/png" sizes="512x512" href="brand/RANDLOGO1.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="brand/RANDLOGO2.png" />
    <link rel="shortcut icon" href="brand/RANDLOGO1.png" />
    <link href="Randomize.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'modern';
        document.documentElement.lang = localStorage.getItem('language') || 'en';
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="512x512" href="brand/RANDLOGO1.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="brand/RANDLOGO1.png" />
    <script src="js/wheel.js"></script>
    <script src="js/rps.js"></script>
    <script src="js/save.js"></script>
    <script src="js/turnstile.js"></script>
    <script src="js/songs-glow.js"></script>
    <script src="js/share.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
    <div id="app">
        <!-- Boot loader. Blazor replaces #app's contents once it mounts, so this
             vanishes on its own. The two-circle SVG is Blazor's real download
             progress; --accent comes from the theme (base.css runs first). -->
        <div class="app-loading" role="status" aria-label="Loading Randomize">
            <div class="app-loading-ring">
                <svg class="loading-progress" aria-hidden="true">
                    <circle r="40%" cx="50%" cy="50%" />
                    <circle r="40%" cx="50%" cy="50%" />
                </svg>
                <img class="app-loading-logo" src="brand/RANDLOGO1.png" alt="" />
            </div>
            <div class="app-loading-word">Randomize</div>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // no service worker - unregister any left by older versions
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(regs => regs.forEach(reg => reg.unregister()));
        }
        if (window.caches) {
            caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
        }

        // drop only fires if dragstart set dataTransfer data, which Blazor can't
        // do from C# - set it here for every draggable (group-shuffler drag-to-move)
        document.addEventListener('dragstart', e => {
            if (e.dataTransfer) {
                e.dataTransfer.setData('text/plain', '');
                e.dataTransfer.effectAllowed = 'move';
            }
        }, true);
    </script>
</body>

</html>
