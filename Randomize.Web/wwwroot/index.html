<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randomize</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" style="width:56px;height:56px;" href="brand/RANDLOGO1.png" />
    <link href="Randomize.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'modern';</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="512x512" href="brand/RANDLOGO1.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="brand/RANDLOGO1.png" />
    <script src="js/wheel.js"></script>
    <script src="js/save.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            // updateViaCache:'none' -> the SW script is always revalidated, so a new
            // deploy is detected promptly instead of being masked by the HTTP cache.
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
            // When the freshly-installed SW takes control after a deploy, reload once
            // so the page swaps the stale cached index.html + css for the new ones.
            if (navigator.serviceWorker.controller) {
                let reloading = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (reloading) return;
                    reloading = true;
                    location.reload();
                });
            }
        }
    </script>
</body>

</html>
