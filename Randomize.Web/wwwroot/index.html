<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tints the iOS Safari address bar and Chrome's chrome to match the app. -->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- iOS standalone-web-app hints (used if the user "Adds to Home Screen"). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Randomize" />
    <title>Randomize</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" style="width:56px;height:56px;" href="brand/RANDLOGO1.png" />
    <link href="Randomize.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'modern';</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="512x512" href="brand/RANDLOGO1.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="brand/RANDLOGO1.png" />
    <script src="js/wheel.js"></script>
    <script src="js/save.js"></script>
    <script src="js/turnstile.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // This app does not use a service worker. Proactively remove any worker
        // and caches left by older versions so the latest files always load.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(regs => regs.forEach(reg => reg.unregister()));
        }
        if (window.caches) {
            caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
        }

        // HTML5 drag-and-drop: the browser only fires `drop` if `dragstart` set
        // some data on dataTransfer. Blazor's DragEventArgs is a one-way snapshot
        // so we can't do it from C#. A capture-phase listener sets data for every
        // draggable on the page before any other handler runs — that's all the
        // group-shuffler drag-to-move needs to work reliably across browsers.
        document.addEventListener('dragstart', e => {
            if (e.dataTransfer) {
                e.dataTransfer.setData('text/plain', '');
                e.dataTransfer.effectAllowed = 'move';
            }
        }, true);
    </script>
</body>

</html>
