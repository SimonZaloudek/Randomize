<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Reuse the REAL site CSS so the recording is pixel-true to the page. -->
<link rel="stylesheet" href="../../Randomize.Web/wwwroot/css/base.css" />
<link rel="stylesheet" href="../../Randomize.Web/wwwroot/css/tools.css" />
<style>
  /* transparent so the GIF drops cleanly onto Discord's embed background */
  html, body { margin: 0; background: transparent; }
  #stage {
    width: 160px; height: 160px;
    display: flex; align-items: center; justify-content: center;
    perspective: 600px;            /* same as .coin-stage */
  }
  .hidden { display: none !important; }
  /* the real .coin transition is driven frame-by-frame here, not by CSS */
  #coin { transition: none !important; }
</style>
</head>
<body>
  <div id="stage">
    <div class="coin" id="coin">
      <div class="coin-face heads">H</div>
      <div class="coin-face tails">T</div>
    </div>
    <div class="die hidden" id="die"></div>
  </div>

<script>
  const coin = document.getElementById("coin");
  const die  = document.getElementById("die");

  // 3x3 pip layout (cell indices 0-8) for faces 1-6 - mirrors NumberRandomizer
  const PIPS = [[], [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8]];

  // --- cubic-bezier(0.3, 0.6, 0.3, 1) easing, matching .coin's transition ---
  function bezier(p1x, p1y, p2x, p2y) {
    const A = (a, b) => 1 - 3 * b + 3 * a, B = (a, b) => 3 * b - 6 * a, C = a => 3 * a;
    const calc = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
    const slope = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
    const solveX = x => { let t = x; for (let i = 0; i < 8; i++) { const cx = calc(t, p1x, p2x) - x, d = slope(t, p1x, p2x); if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break; t -= cx / d; } return t; };
    return x => calc(solveX(x), p1y, p2y);
  }
  const coinEase = bezier(0.3, 0.6, 0.3, 1);

  // --- dice-tumble keyframes: [phase, rotateDeg, translateY, scale] ---
  const TUMBLE = [[0, 0, 0, 1], [0.25, -20, -9, 1.08], [0.5, 15, 3, 0.95], [0.75, -9, -5, 1.05], [1, 0, 0, 1]];
  function tumbleAt(phase) {
    for (let i = 1; i < TUMBLE.length; i++) {
      if (phase <= TUMBLE[i][0]) {
        const a = TUMBLE[i - 1], b = TUMBLE[i];
        const f = (phase - a[0]) / (b[0] - a[0]);
        const rot = a[1] + (b[1] - a[1]) * f, ty = a[2] + (b[2] - a[2]) * f, sc = a[3] + (b[3] - a[3]) * f;
        return `rotate(${rot}deg) translateY(${ty}px) scale(${sc})`;
      }
    }
    return "rotate(0deg) translateY(0) scale(1)";
  }

  function setFace(n) {
    die.innerHTML = "";
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("span");
      cell.className = "pip-cell";
      if (PIPS[n].includes(i)) { const p = document.createElement("span"); p.className = "pip"; cell.appendChild(p); }
      die.appendChild(cell);
    }
  }

  // --- functions the recorder calls via page.evaluate ---
  window.showCoin = () => { coin.classList.remove("hidden"); die.classList.add("hidden"); };
  window.showDie  = () => { die.classList.remove("hidden"); coin.classList.add("hidden"); };

  // t in [0,1]; target 0 = heads (lands at multiple of 360), 1 = tails (+180)
  window.coinFrame = (t, tails) => {
    const end = 1800 + (tails ? 180 : 0);
    coin.style.transform = `rotateY(${end * coinEase(t)}deg)`;
  };

  // phase null = settled (no tumble); otherwise tumble at that phase
  window.dieFrame = (face, phase) => {
    setFace(face);
    die.style.transform = phase == null ? "none" : tumbleAt(phase);
  };
</script>
</body>
</html>
